name: MCP Server Tests

# 1. QUAND : Le déclencheur
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. OÙ : Le serveur
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    # 3. QUOI : Les étapes
    steps:
      # A. On télécharge ton code sur le serveur
      - name: Checkout code
        uses: actions/checkout@v7

      # B. On installe Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip" # Accélère les prochaines exécutions

      # C. On installe ton serveur et ses dépendances (le fameux mode [dev])
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q

  # Keep the required ruleset check named "test" while exposing both matrix results.
  test:
    runs-on: ubuntu-latest
    needs: python-tests
    if: always()
    steps:
      - name: Fail unless every Python matrix job passed
        if: ${{ needs.python-tests.result != 'success' }}
        run: exit 1

      - name: Confirm Python matrix passed
        if: ${{ needs.python-tests.result == 'success' }}
        run: echo "Python 3.12 and 3.13 test jobs passed."
